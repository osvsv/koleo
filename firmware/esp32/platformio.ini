[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Versiones FIJADAS (CC-011): sin rangos abiertos.
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.2.0
; NaN/Infinity se aceptan al deserializar para poder responder PESO_INVALIDO (en vez de descartar el comando).
build_flags =
    -DARDUINOJSON_ENABLE_NAN=1
    -DARDUINOJSON_ENABLE_INFINITY=1
